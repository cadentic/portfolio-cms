name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests (acceptance criteria 1–14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  frontend:
    name: Angular SSR build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  infra:
    name: Terraform and Ansible checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: shared-variables.tf copies match
        run: scripts/sync-terraform-vars.sh --check
      - name: terraform validate
        run: |
          for root in gcp azure vps dns media-gcs media-azure; do
            echo "== $root"
            terraform -chdir=infra/terraform/$root init -backend=false -input=false >/dev/null
            terraform -chdir=infra/terraform/$root validate
          done
      - name: ansible syntax check
        run: |
          pipx install ansible-core
          for target in gcp azure vps; do
            ansible-playbook --syntax-check infra/ansible/deploy.yml -e target=$target
          done

  cloudmigrate:
    name: Migration tool (unit tests and Postgres 18 / media integration test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/cloudmigrate -v
      - run: tools/cloudmigrate/integration_test.sh

  e2e:
    name: Docker stack + browser tests (acceptance criterion 15)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
