# Pulls csayantan.wordpress.com through the WordPress.com public API and
# commits the converted content (content/wordpress, images under
# frontend/public/media/wordpress, backend migration 0003) back to the branch.
# Runs on demand, and whenever the importer changes.
name: WordPress import

on:
  workflow_dispatch:
  push:
    paths:
      - tools/wpimport/**
      - .github/workflows/wordpress-import.yml

permissions:
  contents: write

concurrency:
  group: wordpress-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: tools/wpimport/go.sum
      - name: Test importer
        working-directory: tools/wpimport
        run: go vet ./... && go test ./...
      - name: Test seed against Postgres
        run: scripts/test-wordpress-seed.sh
      - name: Fetch and convert WordPress content
        run: scripts/wordpress-import.sh fetch
      - name: Commit content
        run: |
          git add content/wordpress frontend/public/media/wordpress
          [ -f backend/internal/store/migrations/0003_wordpress_import.sql ] && git add backend/internal/store/migrations/0003_wordpress_import.sql
          if git diff --cached --quiet; then echo "No content changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import WordPress content from csayantan.wordpress.com"
          git push
