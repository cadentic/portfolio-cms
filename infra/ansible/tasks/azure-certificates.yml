# Binds a free managed certificate to one hostname, once. The zone apex is
# validated over HTTP; www and subdomains (CNAME records) over CNAME.
- name: Check binding for {{ hostname }}
  ansible.builtin.command: >
    az containerapp hostname list -g {{ tf_out.resource_group.value }} -n {{ tf_out.web_app.value }}
    --query "[?name=='{{ hostname }}'].bindingType | [0]" -o tsv
  register: binding
  changed_when: false

- name: Bind managed certificate for {{ hostname }}
  when: binding.stdout != 'SniEnabled'
  ansible.builtin.command: >
    az containerapp hostname bind --hostname {{ hostname }}
    -g {{ tf_out.resource_group.value }} -n {{ tf_out.web_app.value }}
    --environment {{ tf_out.environment.value }}
    --validation-method {{ 'HTTP' if hostname == tf_out.zone_apex.value else 'CNAME' }}
  changed_when: true
