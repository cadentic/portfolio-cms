# Build, push and deploy portfolio-cms, then point the domain at it.
#
#   ansible-playbook deploy.yml -e target=gcp      # Google Cloud Run
#   ansible-playbook deploy.yml -e target=azure    # Azure Container Apps
#   ansible-playbook deploy.yml -e target=vps      # any VPS with root SSH (Docker Compose + Caddy)
#
# -e switch_dns=false deploys and smoke-tests the target without pointing the
# domain at it: the first step of moving to another host. tools/cloudmigrate
# runs these steps (and moves the database) for you.
#
# Needs: docker (with buildx), terraform >= 1.9, and gcloud or az signed in
# (gcp/azure) or SSH key access to the server (vps). All secrets and settings
# come from infra/terraform/secret.tfvars.
- name: Build and deploy portfolio-cms
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target: gcp
    switch_dns: true
    # vps only: "db" starts just the database container (used while moving data).
    vps_up: all
    repo_root: "{{ playbook_dir }}/../.."
    tf_root: "{{ playbook_dir }}/../terraform"
    tf_dir: "{{ tf_root }}/{{ target }}"
    tfvars: "{{ tf_root }}/secret.tfvars"
    image_tag: "{{ lookup('ansible.builtin.pipe', 'git -C ' ~ repo_root ~ ' rev-parse --short=12 HEAD') }}"
    registry_targets:
      gcp: ["google_project_service.apis", "google_artifact_registry_repository.images"]
      azure: ["azurerm_resource_group.rg", "azurerm_container_registry.acr"]
    tf_base: ["terraform", "-chdir={{ tf_dir }}"]
  tasks:
    - name: Check inputs
      ansible.builtin.assert:
        that:
          - target in ['gcp', 'azure', 'vps']
          - lookup('ansible.builtin.fileglob', tfvars) | length > 0
          - vps_up in ['all', 'db']
          - vps_up == 'all' or (target == 'vps' and not (switch_dns | bool))
        fail_msg: >-
          Use -e target=gcp|azure|vps and create {{ tfvars }} from secret.tfvars.example.
          -e vps_up=db is only for target=vps together with -e switch_dns=false.

    - name: Refuse to deploy uncommitted changes
      ansible.builtin.command: git -C {{ repo_root }} status --porcelain
      register: git_status
      changed_when: false
      failed_when: git_status.stdout | length > 0 and not (allow_dirty | default(false) | bool)

    # A dirty build gets its own tag, so it never overwrites the image of the
    # commit it was built from.
    - name: Remember the settings for the later plays
      ansible.builtin.set_fact:
        target: "{{ target }}"
        switch_dns: "{{ switch_dns | bool }}"
        image_tag: "{{ image_tag ~ ('-dirty-' ~ now(utc=true, fmt='%Y%m%d%H%M%S') if git_status.stdout | length > 0 else '') }}"

    - name: Terraform init
      ansible.builtin.command:
        argv: "{{ tf_base + ['init', '-input=false'] }}"
      changed_when: false

    # The media bucket comes first: the site's settings include its key, if any.
    - name: Read media_storage from secret.tfvars
      ansible.builtin.set_fact:
        media_storage: "{{ (lookup('ansible.builtin.file', tfvars) | regex_findall('(?m)^\\s*media_storage\\s*=\\s*\"(\\w+)\"')) | first | default('local') }}"

    - name: Media bucket
      when: media_storage != 'local'
      vars:
        media_base: ["terraform", "-chdir={{ tf_root }}/media-{{ media_storage }}"]
        # Only a site in the bucket's own cloud can use its managed identity.
        media_key_needed: "{{ (target, media_storage) not in [('gcp', 'gcs'), ('azure', 'azure')] }}"
      block:
        - name: Terraform init (media bucket)
          ansible.builtin.command:
            argv: "{{ media_base + ['init', '-input=false'] }}"
          changed_when: false

        - name: Terraform apply (media bucket)
          ansible.builtin.command:
            argv: "{{ media_base + ['apply', '-input=false', '-auto-approve', '-var-file=' ~ tfvars] }}"
          register: tf_media
          changed_when: "'No changes.' not in tf_media.stdout"

        - name: Read the media key
          ansible.builtin.command:
            argv: "{{ media_base + ['output', '-raw', 'credentials'] }}"
          register: media_key
          changed_when: false
          no_log: true

        - name: Check that the site can reach the bucket
          ansible.builtin.assert:
            that: media_key.stdout | length > 0 or not media_key_needed
            fail_msg: >-
              A site on {{ target }} reaches a {{ media_storage }} bucket with a key limited to it.
              Set media_access_key = true in secret.tfvars and run the playbook again.

    - name: Hand the media key to the site's Terraform root
      ansible.builtin.copy:
        content: "{{ {'media_gcs_credentials': media_key.stdout | default('') if media_storage == 'gcs' else '',
                      'media_azure_sas': media_key.stdout | default('') if media_storage == 'azure' else ''} | to_json }}\n"
        dest: "{{ tf_dir }}/media.auto.tfvars.json"
        mode: "0600"
      no_log: true

    - name: Cloud Run or Container Apps
      when: target != 'vps'
      block:
        - name: Create the image registry first
          ansible.builtin.command:
            argv: "{{ tf_base + ['apply', '-input=false', '-auto-approve', '-var-file=' ~ tfvars] + (registry_targets[target] | map('regex_replace', '^', '-target=') | list) }}"
          register: tf_registry
          changed_when: "'No changes.' not in tf_registry.stdout"

        - name: Read registry address
          ansible.builtin.command:
            argv: "{{ tf_base + ['output', '-raw', 'registry'] }}"
          register: registry
          changed_when: false

        - name: Docker login (Google Artifact Registry)
          when: target == 'gcp'
          ansible.builtin.command: gcloud auth configure-docker {{ registry.stdout.split('/')[0] }} --quiet
          changed_when: false

        - name: Docker login (Azure Container Registry)
          when: target == 'azure'
          ansible.builtin.command: az acr login --name {{ registry.stdout.split('.')[0] }}
          changed_when: false

        - name: Build and push images
          ansible.builtin.command:
            argv: "{{ ['docker', 'buildx', 'build', '--platform', 'linux/amd64', '--push'] + item.args
                      + ['-t', registry.stdout ~ '/' ~ item.name ~ ':' ~ image_tag, repo_root ~ '/' ~ item.context] }}"
          loop:
            - { name: api, context: backend, args: ["--target=api"] }
            - { name: web, context: frontend, args: [] }
          loop_control: { label: "{{ item.name }}" }
          changed_when: true

        # Azure adds a hostname only after checking its DNS records, so on the
        # first deploy the hostnames wait until the dns/ root has run.
        - name: Check whether the domain is already bound (Azure)
          when: target == 'azure'
          ansible.builtin.command:
            argv: "{{ tf_base + ['state', 'list', 'azurerm_container_app_custom_domain.site'] }}"
          register: azure_bound
          changed_when: false
          failed_when: false

        - name: Terraform apply
          ansible.builtin.command:
            argv: "{{ tf_base + ['apply', '-input=false', '-auto-approve', '-var-file=' ~ tfvars,
                   '-var=api_image=' ~ registry.stdout ~ '/api:' ~ image_tag,
                   '-var=web_image=' ~ registry.stdout ~ '/web:' ~ image_tag]
                   + (['-var=domain_ready=' ~ ((azure_bound.stdout | default('') | trim | length > 0) | string | lower)] if target == 'azure' else []) }}"
          register: tf_apply
          changed_when: "'No changes.' not in tf_apply.stdout"

    - name: Render the server settings (VPS)
      when: target == 'vps'
      ansible.builtin.command:
        argv: "{{ tf_base + ['apply', '-input=false', '-auto-approve', '-var-file=' ~ tfvars] }}"
      register: tf_apply
      changed_when: "'No changes.' not in tf_apply.stdout"

    - name: Read the server's .env (VPS)
      when: target == 'vps'
      ansible.builtin.command:
        argv: "{{ tf_base + ['output', '-raw', 'env_file'] }}"
      register: vps_env
      changed_when: false
      no_log: true

    - name: Read outputs
      ansible.builtin.command:
        argv: "{{ tf_base + ['output', '-json'] }}"
      register: tf_out_raw
      changed_when: false
      no_log: true # the vps root's env_file output holds secrets

    - name: Parse outputs
      ansible.builtin.set_fact:
        tf_out: "{{ tf_out_raw.stdout | from_json | dict2items | rejectattr('key', 'equalto', 'env_file') | items2dict }}"

    - name: VPS images
      when: target == 'vps'
      vars:
        vps_images: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) }}/portfolio-images-{{ image_tag }}.tar.gz"
      block:
        - name: Build images for the server
          ansible.builtin.command:
            argv: "{{ ['docker', 'buildx', 'build', '--platform', tf_out.platform.value, '--load'] + item.args
                      + ['-t', 'portfolio-' ~ item.name ~ ':' ~ image_tag, repo_root ~ '/' ~ item.context] }}"
          loop:
            - { name: api, context: backend, args: ["--target=api"] }
            - { name: web, context: frontend, args: [] }
          loop_control: { label: "{{ item.name }}" }
          changed_when: true

        - name: Save the images to a file
          ansible.builtin.shell:
            cmd: set -o pipefail && docker save portfolio-api:{{ image_tag }} portfolio-web:{{ image_tag }} | gzip -1 > {{ vps_images | quote }}
            executable: /bin/bash
          changed_when: true

        - name: Add the server to this run
          ansible.builtin.add_host:
            name: vps
            groups: vps_target
            ansible_host: "{{ tf_out.ssh.value.host }}"
            ansible_user: "{{ tf_out.ssh.value.user }}"
            ansible_port: "{{ tf_out.ssh.value.port }}"
            vps_dir: "{{ tf_out.ssh.value.dir }}"
            image_tag: "{{ image_tag }}"
            vps_images: "{{ vps_images }}"
            vps_up: "{{ vps_up }}"

- name: Run the stack on the VPS
  hosts: vps_target
  gather_facts: true
  become: "{{ ansible_user != 'root' }}"
  tasks:
    - name: Install Docker and open the web ports
      ansible.builtin.include_tasks: tasks/vps-docker.yml

    # Owned by the SSH user, so that `docker compose` (and tools/cloudmigrate)
    # can read .env without sudo.
    - name: Create the app directory
      ansible.builtin.file:
        path: "{{ vps_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0750"

    - name: Copy the compose file and Caddyfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../vps/{{ item }}"
        dest: "{{ vps_dir }}/{{ item }}"
        owner: "{{ ansible_user }}"
        mode: "0644"
      loop: [compose.yml, Caddyfile]

    - name: Write the .env file
      ansible.builtin.copy:
        # register strips the output's final newline, so add it back.
        content: "{{ hostvars['localhost'].vps_env.stdout | trim }}\nIMAGE_TAG='{{ image_tag }}'\n"
        dest: "{{ vps_dir }}/.env"
        owner: "{{ ansible_user }}"
        mode: "0600"
      no_log: true

    # Next to the app, not in /tmp, which is a small RAM disk on some servers.
    - name: Upload the images
      ansible.builtin.copy:
        src: "{{ vps_images }}"
        dest: "{{ vps_dir }}/images-{{ image_tag }}.tar.gz"
        mode: "0600"

    - name: Load the images
      ansible.builtin.command: docker load -i {{ vps_dir }}/images-{{ image_tag }}.tar.gz
      changed_when: true

    - name: Remove the uploaded image file
      ansible.builtin.file:
        path: "{{ vps_dir }}/images-{{ image_tag }}.tar.gz"
        state: absent

    - name: Start the database only
      when: vps_up == 'db'
      ansible.builtin.command:
        cmd: docker compose up -d --wait --wait-timeout 180 db
        chdir: "{{ vps_dir }}"
      changed_when: true

    - name: Start or update the stack
      when: vps_up == 'all'
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans --wait --wait-timeout 300
        chdir: "{{ vps_dir }}"
      changed_when: true

    - name: Smoke test the web container
      when: vps_up == 'all'
      ansible.builtin.command:
        cmd: docker compose exec -T web wget -qO /dev/null http://127.0.0.1:4000{{ item }}
        chdir: "{{ vps_dir }}"
      loop: [/healthz, /api/public/site, /robots.txt, /llms.txt, /sitemap.xml, /]
      register: smoke
      retries: 10
      delay: 6
      until: smoke.rc == 0
      changed_when: false

    - name: Remove unused images
      ansible.builtin.command: docker image prune -f
      changed_when: false

- name: Point the domain at the target and check it
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_root: "{{ playbook_dir }}/../terraform"
    tfvars: "{{ tf_root }}/secret.tfvars"
    tf_dir: "{{ tf_root }}/{{ target }}"
    dns_base: ["terraform", "-chdir={{ tf_root }}/dns"]
  tasks:
    # Not /healthz: Cloud Run's front end answers paths ending in "z" itself.
    - name: Smoke test the service URL
      when: target != 'vps'
      ansible.builtin.uri:
        url: "{{ tf_out.web_url.value }}{{ item }}"
        status_code: 200
      loop: [/api/public/site, /robots.txt, /llms.txt, /sitemap.xml, /]
      register: smoke
      retries: 10
      delay: 6
      until: smoke.status == 200

    - name: Point the domain at {{ target }}
      when: switch_dns | bool
      block:
        - name: Terraform init (DNS)
          ansible.builtin.command:
            argv: "{{ dns_base + ['init', '-input=false'] }}"
          changed_when: false

        - name: Terraform apply (DNS)
          ansible.builtin.command:
            argv: "{{ dns_base + ['apply', '-input=false', '-auto-approve', '-var-file=' ~ tfvars,
                   '-var=site_target=' ~ target, '-var=site_records=' ~ (tf_out.site_records.value | to_json)] }}"
          register: tf_dns
          changed_when: "'No changes.' not in tf_dns.stdout"

        - name: Add the hostnames now that DNS points here (Azure, first deploy)
          when: target == 'azure' and tf_out.pending_hostnames.value | length > 0
          ansible.builtin.command:
            argv: "{{ ['terraform', '-chdir=' ~ tf_dir, 'apply', '-input=false', '-auto-approve', '-var-file=' ~ tfvars,
                   '-var=api_image=' ~ registry.stdout ~ '/api:' ~ image_tag,
                   '-var=web_image=' ~ registry.stdout ~ '/web:' ~ image_tag, '-var=domain_ready=true'] }}"
          register: tf_bind
          changed_when: true

        - name: Re-read outputs (Azure)
          when: target == 'azure'
          ansible.builtin.command:
            argv: ["terraform", "-chdir={{ tf_dir }}", "output", "-json"]
          register: tf_out_raw2
          changed_when: false

        - name: Parse outputs (Azure)
          when: target == 'azure'
          ansible.builtin.set_fact:
            tf_out: "{{ tf_out_raw2.stdout | from_json }}"

        - name: Issue free managed certificates (Azure)
          when: target == 'azure'
          ansible.builtin.include_tasks: tasks/azure-certificates.yml
          loop: "{{ tf_out.hostnames.value }}"
          loop_control: { loop_var: hostname }

    - name: Check the public domain (may take a while for DNS and certificates)
      when: switch_dns | bool
      ansible.builtin.uri:
        url: "{{ tf_out.site_url.value }}/robots.txt"
        status_code: 200
      register: site
      failed_when: false
      retries: 5
      delay: 20
      until: site.status == 200

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Deployed {{ image_tag }} to {{ target }} (media: {{ media_storage }})."
          - "Service URL: {{ tf_out.web_url.value }}"
          - "{{ ('Site: ' ~ tf_out.site_url.value ~ ' (' ~ ('up' if site.status | default(0) == 200 else 'not reachable yet; DNS or certificate still provisioning') ~ ')')
                if switch_dns | bool else 'DNS not changed (switch_dns=false): the domain still points at the previous host.' }}"
          - "Set these webhook URLs (with webhook:<secret>@ before the host) in Brevo and Mailjet: {{ tf_out.webhook_urls.value }}"
